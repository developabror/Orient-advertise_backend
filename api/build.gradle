plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':service')
    implementation project(':domain')
    implementation project(':common')
    // STRICT LAYERING: infra is runtimeOnly — prevents compile-time coupling
    runtimeOnly project(':infra')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.1'

    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testImplementation 'org.springframework.security:spring-security-test'

    // H2 backs the `dev` profile (./gradlew :api:bootRun) and the tests, and nothing else:
    // developmentOnly keeps it on the bootRun classpath but out of the production jar.
    developmentOnly 'com.h2database:h2'
    testRuntimeOnly 'com.h2database:h2'
}

bootJar {
    mainClass = 'uz.orientadvertise.services.Application'
}

// Generates META-INF/build-info.properties so Spring Boot exposes a BuildProperties
// bean — used by TelegramStartupNotifier to include the live project version in the
// boot message. Without this task, the bean is absent and the notifier falls back to
// "unknown".
springBoot {
    buildInfo()
}

// Forward the export.openapi system property from the Gradle CLI to the test JVM.
// Without this the @EnabledIfSystemProperty gate on OpenApiExporter never sees the
// flag and the exporter is silently skipped. Other system properties pass through
// untouched. Run: ./gradlew :api:test --tests "*OpenApiExporter*" -Dexport.openapi=true
test {
    if (System.getProperty('export.openapi') != null) {
        systemProperty 'export.openapi', System.getProperty('export.openapi')
    }
}

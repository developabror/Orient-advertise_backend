spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: prod-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    locations: classpath:db/migration
    fail-on-missing-locations: true
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000

app:
  cors:
    # allowCredentials=true forbids a wildcard origin (CORS spec). APP_CORS_ALLOWED_ORIGINS
    # must list the exact FE origin(s), comma-separated — e.g. https://admin.example.com.
    # No default: the deploy MUST supply the SPA origin, otherwise the FE will hit
    # CORS rejections on every request and the failure mode is loud.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  minio:
    url: ${MINIO_URL}
    public-url: ${MINIO_PUBLIC_URL:}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    buckets:
      - uploads
      - content-raw
      - content-processed
      - content-thumbnails
    raw-bucket: content-raw
    thumbnail-bucket: ${MINIO_THUMBNAIL_BUCKET:content-thumbnails}
    presigned-url-expiry-minutes: ${MINIO_PRESIGNED_EXPIRY:120}
    raw-expiry-days: ${MINIO_RAW_EXPIRY_DAYS:30}

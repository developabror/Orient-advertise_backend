spring:
  datasource:
    url: jdbc:h2:mem:migrationtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: infra-test-pool
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
  quartz:
    auto-startup: false

app:
  # JwtTokenProvider fails fast on a blank/short secret; supply a ≥32-byte test value.
  jwt:
    secret: infra-test-jwt-secret-must-be-at-least-32-chars

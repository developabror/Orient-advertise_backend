dependencies {
    implementation project(':domain')
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    // Gmail SMTP for password-reset / changed-notice email. Auto-configures JavaMailSender
    // from spring.mail.*; the sender is wired conditionally on app.mail.enabled (No-Op
    // fallback), so dev/test/CI never open an SMTP socket.
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.minio:minio:8.5.14'
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Telegram bot — long-polling client. Pinned to 6.9.7.1 (last in the 6.x line),
    // which is JDK 21 / Spring Boot 3.x compatible. The library auto-pulls jackson +
    // a small log facade; we explicitly exclude the bundled commons-logging because
    // it conflicts with the slf4j-jcl bridge already on the classpath.
    implementation('org.telegram:telegrambots:6.9.7.1') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    testImplementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

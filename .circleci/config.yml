version: 2.1

executors:
  java:
    docker:
      - image: cimg/openjdk:21.0
    working_directory: ~/project

jobs:
  build-and-test:
    executor: java
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-{{ checksum "build.gradle" }}-{{ checksum "settings.gradle" }}
            - gradle-
      - run:
          name: Build all modules
          command: ./gradlew build --no-daemon
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-{{ checksum "build.gradle" }}-{{ checksum "settings.gradle" }}
      - run:
          name: Run tests
          command: ./gradlew test --no-daemon
      - store_test_results:
          path: service/build/test-results/test
      - store_test_results:
          path: service/build/test-results/test
      - store_test_results:
          path: common/build/test-results/test
      - store_test_results:
          path: domain/build/test-results/test

workflows:
  main:
    jobs:
      - build-and-test

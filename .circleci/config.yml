version: 2.1

executors:
  java:
    docker:
      - image: cimg/openjdk:21.0
      # Redis is REQUIRED to run the suite, not optional. Every full-context @SpringBootTest in the
      # infra module starts a RedisMessageListenerContainer during context refresh, and that startup
      # is eager: without a reachable Redis the context fails and the whole :infra:test task goes red
      # (FlywayMigrationTest, ContentAssignmentOverlapBoundaryTest, ContentFileTranscodeLeaseTest, …).
      # Secondary images share the primary's network namespace, so localhost:6379 resolves — matching
      # the spring.data.redis.host default. The api module excludes Redis autoconfiguration in its
      # test profile and does not need this.
      - image: cimg/redis:7.2
    working_directory: ~/project

jobs:
  build-and-test:
    executor: java
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-{{ checksum "build.gradle" }}-{{ checksum "settings.gradle" }}
            - gradle-
      - run:
          name: Build all modules
          command: ./gradlew build --no-daemon
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-{{ checksum "build.gradle" }}-{{ checksum "settings.gradle" }}
      - run:
          name: Run tests
          command: ./gradlew test --no-daemon
      - store_test_results:
          path: service/build/test-results/test
      - store_test_results:
          path: api/build/test-results/test
      - store_test_results:
          path: infra/build/test-results/test
      - store_test_results:
          path: common/build/test-results/test
      - store_test_results:
          path: domain/build/test-results/test

workflows:
  main:
    jobs:
      - build-and-test
